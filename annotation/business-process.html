<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>业务流程 - 民匠有约</title>
  <link rel="stylesheet" href="css/style.css?v=2025fix53">
  <link rel="stylesheet" href="css/annotation.css">
  <style>
    :root {
      --brand-primary: #1677FF;
      --brand-primary-dark: #0958D9;
      --brand-primary-50: #E6F4FF;
      --brand-primary-100: #BAE0FF;
      --brand-grad: linear-gradient(135deg, #1677FF 0%, #4096FF 100%);
      --brand-grad-light: linear-gradient(180deg, #E6F4FF 0%, #FFFFFF 100%);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #f5f6f7;
      color: var(--text, #0A1628);
      min-height: 100vh;
      line-height: 1.6;
    }

    .topbar {
      background: #fff;
      border-bottom: 1px solid #f0f0f0;
      height: 60px;
      display: flex;
      align-items: center;
      padding: 0 40px;
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }

    .topbar-inner {
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .topbar-logo {
      font-size: 18px;
      font-weight: 800;
      color: var(--brand-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .topbar-logo::before {
      content: '';
      width: 32px;
      height: 32px;
      background: var(--brand-grad);
      border-radius: 8px;
    }

    .topbar-nav {
      display: flex;
      gap: 32px;
      list-style: none;
    }

    .topbar-nav a {
      color: #4E5969;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.2s;
    }

    .topbar-nav a:hover,
    .topbar-nav a.active {
      color: var(--brand-primary);
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .topbar-actions a {
      text-decoration: none;
      font-size: 14px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      border: none;
    }

    .btn-primary {
      background: var(--brand-grad);
      color: #fff;
    }

    .btn-primary:hover {
      box-shadow: 0 4px 12px rgba(22,119,255,0.3);
      transform: translateY(-1px);
    }

    .page-container {
      padding-top: 0;
    }

    .page-hero {
      background: var(--brand-grad);
      padding: 48px 24px;
      text-align: center;
      color: #fff;
    }

    .page-hero h1 {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .page-hero p {
      font-size: 16px;
      opacity: 0.9;
      max-width: 600px;
      margin: 0 auto;
    }

    .bp-section {
      padding: 48px 24px;
      background: linear-gradient(180deg, #F5F9FF 0%, #FFFFFF 100%);
    }

    .bp-grid-single {
      max-width: 1200px;
      margin: 0 auto;
    }

    .bp-grid-dual {
      max-width: 1200px;
      margin: 32px auto 0;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 32px;
    }

    .bp-card {
      background: #fff;
      border-radius: 20px;
      padding: 28px 24px;
      border: 1px solid #E5E8EF;
      box-shadow: 0 4px 16px rgba(10,22,40,0.04);
      transition: all 0.3s;
    }

    .bp-card:hover {
      box-shadow: 0 8px 28px rgba(10,22,40,0.08);
      transform: translateY(-3px);
    }

    .bp-card-title {
      font-size: 18px;
      font-weight: 800;
      color: #0A1628;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      line-height: 1.3;
    }

    .bp-card-title::before {
      content: '';
      width: 4px;
      height: 18px;
      background: var(--brand-primary);
      border-radius: 2px;
      flex-shrink: 0;
    }

    .bp-svg-wrap {
      width: 100%;
      overflow-x: auto;
      border-radius: 12px;
      padding: 8px;
      background: #FAFBFC;
      border: 1px solid #E5E8EF;
    }

    .bp-svg-wrap svg { width: 100%; height: auto; display: block; margin: 0 auto; }

    @media (max-width: 900px) {
      .bp-grid-dual { grid-template-columns: 1fr; gap: 20px; }
      .bp-card { padding: 20px 16px; }
      .bp-card-title { font-size: 16px; }
      .topbar { padding: 0 16px; }
      .topbar-nav { display: none; }
      .page-hero h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="page-container">
    <div class="page-hero">
      <h1>全链路业务关系示意</h1>
      <p>从企业注册入驻到母子公司多级组织管理，可视化展示平台核心业务流转与主体关联关系</p>
    </div>

    <section class="bp-section" id="business-process">
      <div class="bp-grid-single" style="margin-bottom: 32px;">
        <div class="bp-card">
          <div class="bp-card-title" id="bp-title-register">注册全流程 · 企业平台入驻时序图</div>
          <div class="bp-svg-wrap" id="bp-chart-register">
            <svg viewBox="0 0 1100 200" preserveAspectRatio="xMidYMid meet">
              <defs>
                <marker id="bp-arrow-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                  <path d="M 0 0 L 10 5 L 0 10 z" fill="#1677FF"/>
                </marker>
                <filter id="bp-soft" x="-20%" y="-30%" width="140%" height="160%">
                  <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0A1628" flood-opacity="0.08"/>
                </filter>
              </defs>
              <line x1="30" y1="80" x2="1070" y2="80" stroke="#E5E8EF" stroke-width="1" stroke-dasharray="4 4"/>
              <!-- ① 提交资料 -->
              <g filter="url(#bp-soft)">
                <rect x="20"  y="40" width="140" height="70" rx="12" fill="#fff" stroke="#BAE0FF"/>
                <text x="90" y="68"  text-anchor="middle" font-size="13" font-weight="700" fill="#0A1628">① 提交资料</text>
                <text x="90" y="90"  text-anchor="middle" font-size="11" fill="#595959">企业信息+法人</text>
              </g>
              <line x1="160" y1="75" x2="185" y2="75" stroke="#1677FF" stroke-width="2" marker-end="url(#bp-arrow-h)"/>
              <!-- ② 实名校验 -->
              <g filter="url(#bp-soft)">
                <rect x="185" y="40" width="140" height="70" rx="12" fill="#fff" stroke="#B7EB8F"/>
                <text x="255" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#0A1628">② 实名校验</text>
                <text x="255" y="90" text-anchor="middle" font-size="11" fill="#595959">工商+法人实名</text>
              </g>
              <line x1="325" y1="75" x2="350" y2="75" stroke="#1677FF" stroke-width="2" marker-end="url(#bp-arrow-h)"/>
              <!-- ③ 认证通过 -->
              <g filter="url(#bp-soft)">
                <rect x="350" y="40" width="140" height="70" rx="12" fill="#fff" stroke="#D3ADF7"/>
                <text x="420" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#0A1628">③ 认证通过</text>
                <text x="420" y="90" text-anchor="middle" font-size="11" fill="#595959">生成企业档案</text>
              </g>
              <line x1="490" y1="75" x2="515" y2="75" stroke="#1677FF" stroke-width="2" marker-end="url(#bp-arrow-h)"/>
              <!-- ④ 设置主管理员 -->
              <g filter="url(#bp-soft)">
                <rect x="515" y="40" width="140" height="70" rx="12" fill="#F6FFED" stroke="#95DE64"/>
                <text x="585" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#0A1628">④ 设置主管理员</text>
                <text x="585" y="90" text-anchor="middle" font-size="11" fill="#595959">唯一超级管理员</text>
              </g>
              <line x1="655" y1="75" x2="680" y2="75" stroke="#1677FF" stroke-width="2" marker-end="url(#bp-arrow-h)"/>
              <!-- ⑤ 创建子公司（可选） -->
              <g filter="url(#bp-soft)">
                <rect x="680" y="40" width="140" height="70" rx="12" fill="#FFF7E6" stroke="#FFC069"/>
                <text x="750" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#0A1628">⑤ 创建子公司</text>
                <text x="750" y="90" text-anchor="middle" font-size="11" fill="#595959">母公司直接创建</text>
              </g>
              <line x1="820" y1="75" x2="845" y2="75" stroke="#1677FF" stroke-width="2" marker-end="url(#bp-arrow-h)"/>
              <!-- ⑥ 分配权限与角色 -->
              <g filter="url(#bp-soft)">
                <rect x="845" y="40" width="140" height="70" rx="12" fill="#fff" stroke="#91CAFF"/>
                <text x="915" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#0A1628">⑥ 分配权限</text>
                <text x="915" y="90" text-anchor="middle" font-size="11" fill="#595959">权限与角色配置</text>
              </g>
              <line x1="985" y1="75" x2="1010" y2="75" stroke="#1677FF" stroke-width="2" marker-end="url(#bp-arrow-h)"/>
              <!-- ⑦ 功能启用 -->
              <g filter="url(#bp-soft)">
                <rect x="1010" y="40" width="80" height="70" rx="12" fill="#1677FF"/>
                <text x="1050" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">⑦ 启用</text>
                <text x="1050" y="90" text-anchor="middle" font-size="11" fill="#E6F4FF">入驻完成</text>
              </g>
            </svg>
          </div>
        </div>
      </div>

      <div class="bp-grid-single">
        <div class="bp-card">
          <div class="bp-card-title" id="bp-title-multi-entity">一个用户对应多家主体公司的关联关系图</div>
          <div class="bp-svg-wrap" id="bp-chart-multi-entity" style="display:flex;justify-content:center;align-items:center;">
            <svg viewBox="0 0 900 420" preserveAspectRatio="xMidYMid meet" style="display:block;margin:0 auto;">
              <defs>
                <marker id="bp-arrow-multi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                  <path d="M 0 0 L 10 5 L 0 10 z" fill="#86909C"/>
                </marker>
                <linearGradient id="bp-user-g" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#1677FF" stop-opacity="0.15"/>
                  <stop offset="100%" stop-color="#1677FF" stop-opacity="0.03"/>
                </linearGradient>
                <linearGradient id="bp-ent-g1" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#52C41A" stop-opacity="0.12"/>
                  <stop offset="100%" stop-color="#52C41A" stop-opacity="0.02"/>
                </linearGradient>
                <linearGradient id="bp-ent-g2" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#FA8C16" stop-opacity="0.12"/>
                  <stop offset="100%" stop-color="#FA8C16" stop-opacity="0.02"/>
                </linearGradient>
                <linearGradient id="bp-ent-g3" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#722ED1" stop-opacity="0.12"/>
                  <stop offset="100%" stop-color="#722ED1" stop-opacity="0.02"/>
                </linearGradient>
                <filter id="bp-shadow">
                  <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
                </filter>
              </defs>

              <!-- 中心用户卡片 - 纯文字居中 -->
              <g filter="url(#bp-shadow)">
                <rect x="340" y="20" width="220" height="90" rx="16" fill="url(#bp-user-g)" stroke="#1677FF" stroke-width="2"/>
                <text x="450" y="46" text-anchor="middle" font-size="15" font-weight="800" fill="#0A1628">用户账号</text>
                <text x="450" y="64" text-anchor="middle" font-size="12" fill="#595959">手机号/邮箱登录</text>
                <text x="450" y="80" text-anchor="middle" font-size="11" fill="#1677FF">（唯一身份标识）</text>
              </g>

              <!-- 主体公司 A -->
              <g filter="url(#bp-shadow)">
                <rect x="20" y="165" width="250" height="90" rx="14" fill="url(#bp-ent-g1)" stroke="#52C41A" stroke-width="1.5"/>
                <text x="145" y="192" text-anchor="middle" font-size="15" font-weight="800" fill="#237804">主体公司 A</text>
                <text x="145" y="214" text-anchor="middle" font-size="12" fill="#595959">杭州良巧匠科技有限公司</text>
                <!-- 权限标签 - 放大居中 -->
                <rect x="80" y="230" width="56" height="22" rx="11" fill="#52C41A" opacity="0.15"/>
                <text x="108" y="245" text-anchor="middle" font-size="11" font-weight="600" fill="#52C41A">管理员</text>
                <rect x="140" y="230" width="56" height="22" rx="11" fill="#F5222D" opacity="0.15"/>
                <text x="168" y="245" text-anchor="middle" font-size="11" font-weight="600" fill="#F5222D">财务</text>
              </g>

              <!-- 主体公司 B -->
              <g filter="url(#bp-shadow)">
                <rect x="325" y="165" width="250" height="90" rx="14" fill="url(#bp-ent-g2)" stroke="#FA8C16" stroke-width="1.5"/>
                <text x="450" y="192" text-anchor="middle" font-size="15" font-weight="800" fill="#AD4E00">主体公司 B</text>
                <text x="450" y="214" text-anchor="middle" font-size="12" fill="#595959">宁波匠人咨询服务有限公司</text>
                <!-- 权限标签 - 放大居中 -->
                <rect x="385" y="230" width="56" height="22" rx="11" fill="#FA8C16" opacity="0.15"/>
                <text x="413" y="245" text-anchor="middle" font-size="11" font-weight="600" fill="#FA8C16">管理员</text>
                <rect x="445" y="230" width="56" height="22" rx="11" fill="#1677FF" opacity="0.15"/>
                <text x="473" y="245" text-anchor="middle" font-size="11" font-weight="600" fill="#1677FF">运营</text>
              </g>

              <!-- 主体公司 C -->
              <g filter="url(#bp-shadow)">
                <rect x="630" y="165" width="250" height="90" rx="14" fill="url(#bp-ent-g3)" stroke="#722ED1" stroke-width="1.5"/>
                <text x="755" y="192" text-anchor="middle" font-size="15" font-weight="800" fill="#531DAB">主体公司 C</text>
                <text x="755" y="214" text-anchor="middle" font-size="12" fill="#595959">上海匠艺建筑设计有限公司</text>
                <!-- 权限标签 - 放大居中 -->
                <rect x="727" y="230" width="56" height="22" rx="11" fill="#722ED1" opacity="0.15"/>
                <text x="755" y="245" text-anchor="middle" font-size="11" font-weight="600" fill="#722ED1">成员</text>
              </g>

              <!-- 连接线：用户 → 主体 A -->
              <path d="M 390 110 C 320 130 240 150 192 165" stroke="#52C41A" stroke-width="2" fill="none" stroke-dasharray="6 3" marker-end="url(#bp-arrow-multi)"/>
              <text x="280" y="128" text-anchor="middle" font-size="10" fill="#52C41A" font-weight="600">管理员权限</text>

              <!-- 连接线：用户 → 主体 B -->
              <path d="M 450 110 L 450 165" stroke="#FA8C16" stroke-width="2" fill="none" stroke-dasharray="6 3" marker-end="url(#bp-arrow-multi)"/>
              <text x="465" y="140" text-anchor="start" font-size="10" fill="#FA8C16" font-weight="600">管理员权限</text>

              <!-- 连接线：用户 → 主体 C -->
              <path d="M 510 110 C 580 130 660 150 718 165" stroke="#722ED1" stroke-width="2" fill="none" stroke-dasharray="6 3" marker-end="url(#bp-arrow-multi)"/>
              <text x="620" y="128" text-anchor="middle" font-size="10" fill="#722ED1" font-weight="600">普通成员</text>

              <!-- 底部说明 -->
              <rect x="200" y="300" width="500" height="80" rx="12" fill="#F5F9FF" stroke="#E6F4FF" stroke-width="1"/>
              <text x="450" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#0A1628">多主体关联说明</text>
              <text x="450" y="344" text-anchor="middle" font-size="11" fill="#595959">• 同一用户账号可同时关联多家主体公司</text>
              <text x="450" y="360" text-anchor="middle" font-size="11" fill="#595959">• 在不同主体中拥有独立的角色和权限</text>
              <text x="450" y="376" text-anchor="middle" font-size="11" fill="#595959">• 切换主体时权限自动隔离，确保数据安全</text>
            </svg>
          </div>
        </div>
      </div>

      <div class="bp-grid-single">
        <div class="bp-card">
          <div class="bp-card-title" id="bp-title-admin">企业账号 · 主子管理员关联关系图</div>
          <div class="bp-svg-wrap" id="bp-chart-admin">
            <svg viewBox="0 0 900 400" preserveAspectRatio="xMidYMid meet">
              <defs>
                <marker id="bp-arrow-e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                  <path d="M 0 0 L 10 5 L 0 10 z" fill="#86909C"/>
                </marker>
                <linearGradient id="bp-masterg" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#1677FF" stop-opacity="0.12"/>
                  <stop offset="100%" stop-color="#1677FF" stop-opacity="0.02"/>
                </linearGradient>
                <linearGradient id="bp-subg" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#722ED1" stop-opacity="0.12"/>
                  <stop offset="100%" stop-color="#722ED1" stop-opacity="0.02"/>
                </linearGradient>
              </defs>
              <!-- 母公司 -->
              <rect x="330" y="14"  width="240" height="80" rx="16" fill="url(#bp-masterg)" stroke="#1677FF" stroke-width="1.5"/>
              <text x="450" y="48" text-anchor="middle" font-size="16" font-weight="800" fill="#0A1628">母公司（实名企业主体）</text>
              <text x="450" y="70" text-anchor="middle" font-size="12" fill="#595959">浙江良巧匠科技有限公司</text>
              <!-- 主管理员 -->
              <rect x="320" y="115" width="260" height="74" rx="14" fill="#E6F4FF" stroke="#1677FF"/>
              <text x="450" y="146" text-anchor="middle" font-size="17" font-weight="800" fill="#1677FF">主管理员（Super Admin）</text>
              <text x="450" y="168" text-anchor="middle" font-size="13" fill="#595959">唯一 · 拥有全部权限 · 可创建子管理员</text>
              <!-- 连接线 -->
              <path d="M 450 94 C 450 104 450 108 450 113" stroke="#1677FF" stroke-width="2" marker-end="url(#bp-arrow-e)"/>
              <!-- 子管理员 A -->
              <rect x="20"  y="240" width="200" height="70" rx="14" fill="url(#bp-subg)" stroke="#722ED1"/>
              <text x="120" y="264" text-anchor="middle" font-size="15" font-weight="700" fill="#722ED1">子管理员 A</text>
              <text x="120" y="286" text-anchor="middle" font-size="11" fill="#595959">权限：财务 / 合同 / 资金</text>
              <!-- 子管理员 B -->
              <rect x="350" y="240" width="200" height="70" rx="14" fill="url(#bp-subg)" stroke="#722ED1"/>
              <text x="450" y="264" text-anchor="middle" font-size="15" font-weight="700" fill="#722ED1">子管理员 B</text>
              <text x="450" y="286" text-anchor="middle" font-size="11" fill="#595959">权限：人事 / 用户 / 角色</text>
              <!-- 子管理员 C -->
              <rect x="680" y="240" width="200" height="70" rx="14" fill="url(#bp-subg)" stroke="#722ED1"/>
              <text x="780" y="264" text-anchor="middle" font-size="15" font-weight="700" fill="#722ED1">子管理员 C</text>
              <text x="780" y="286" text-anchor="middle" font-size="11" fill="#595959">权限：运营 / 数据 / 消息</text>
              <!-- 连接线 -->
              <path d="M 410 184 C 350 210 200 220 150 238" stroke="#722ED1" stroke-width="2" fill="none" marker-end="url(#bp-arrow-e)"/>
              <path d="M 450 184 C 450 200 450 210 450 238" stroke="#722ED1" stroke-width="2" fill="none" marker-end="url(#bp-arrow-e)"/>
              <path d="M 490 184 C 560 210 700 220 750 238" stroke="#722ED1" stroke-width="2" fill="none" marker-end="url(#bp-arrow-e)"/>
              <!-- 授权说明 -->
              <rect x="310" y="330" width="280" height="36" rx="18" fill="#FFF7E6" stroke="#FFC069"/>
              <text x="450" y="354" text-anchor="middle" font-size="14" font-weight="700" fill="#FA8C16">⬇ 向下授权 · 继承主管理员权限子集</text>
              <!-- 普通员工 -->
              <rect x="290" y="375" width="320" height="26" rx="13" fill="none" stroke="#FA8C16" stroke-dasharray="3 3"/>
              <text x="450" y="393" text-anchor="middle" font-size="13" fill="#FA8C16">普通员工账号（由子管理员批量创建）</text>
            </svg>
          </div>
        </div>
      </div>

      <div class="bp-grid-single">
        <div class="bp-card">
          <div class="bp-card-title" id="bp-title-hierarchy">母公司与企业（子公司）层级关系图</div>
          <div class="bp-svg-wrap" id="bp-chart-hierarchy">
            <svg viewBox="0 0 900 460" preserveAspectRatio="xMidYMid meet">
